[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "suntimes"
version = "0.1.0"
description = "Sunrise, sunset and day length for a place and date"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Moco"}]

[project.scripts]
suntimes = "suntimes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
